    <link

    <!-- Design system: font-faces + CSS custom properties -->
    <link rel="stylesheet" href="/assets/css/base/fonts.css" />
    <link rel="stylesheet" href="/assets/css/base/variables.css" />

    <style>
      /* ================================================
         RESET
         ================================================ */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        max-width: 100vw;
        overflow-x: hidden;
      }

      /* ================================================
         PAGE BASE
         ================================================ */
      body {
        font-family: "Poppins", system-ui, sans-serif;
        font-weight: 400;
        line-height: 1.5;
        background-color: #111111;
        background-image: url('/assets/img/textures/temporal-gradient.png');
        background-size: 300px;
        background-position: top left;
        background-repeat: no-repeat;
        color: #f5f5f5;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3.5rem 1.5rem 2.5rem;
        position: relative;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      /* ================================================
         BACKGROUND BLOBS — services section pattern
         ================================================ */
      .bg-blob {
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        will-change: opacity, transform;
        z-index: 0;
      }

      /* Top-right — bright orange */
      .bg-blob--1 {
        top: -80px;
        right: -100px;
        width: 340px;
        height: 340px;
        background: var(--color-primary);
        filter: blur(90px);
        animation: gradient-pulse-1 6s ease-in-out infinite;
      }

      /* Bottom-left — deep red-orange */
      .bg-blob--2 {
        bottom: -100px;
        left: -120px;
        width: 400px;
        height: 400px;
        background: var(--color-on-primary);
        filter: blur(100px);
        animation: gradient-pulse-2 8s ease-in-out infinite;
      }

      /* Center subtle — amber */
      .bg-blob--3 {
        top: 40%;
        right: -60px;
        width: 180px;
        height: 180px;
        background: var(--electric-border-color);
        filter: blur(110px);
        animation: gradient-pulse-1 10s ease-in-out infinite 3s;
        opacity: 0.6;
      }

      /* ================================================
         KEYFRAMES
         ================================================ */
      @keyframes gradient-pulse-1 {
        0%, 100% { opacity: 0.3;  transform: scale(0.85); }
        50%       { opacity: 0.55; transform: scale(1.05); }
      }

      @keyframes gradient-pulse-2 {
        0%, 100% { opacity: 0.25; transform: scale(0.9);  }
        50%       { opacity: 0.45; transform: scale(1.15); }
      }

      @keyframes ring-rotate {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      @keyframes glow-pulse {
        0%, 100% { opacity: 0.45; transform: scale(1);    }
        50%       { opacity: 0.85; transform: scale(1.12); }
      }

      @keyframes float-in {
        from { opacity: 0; transform: translateY(28px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ================================================
         LANGUAGE TOGGLE
         ================================================ */
      .lang-toggle {
        position: fixed;
        top: 1rem;
        right: 1rem;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        background: rgba(255, 255, 255, 0.07);
        color: #f5f5f5;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        padding: 0.35rem 0.85rem 0.35rem 0.7rem;
        font-family: "Poppins", system-ui, sans-serif;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        z-index: 100;
        transition: background 0.25s ease, border-color 0.25s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .lang-toggle:hover,
      .lang-toggle:focus-visible {
        background: rgba(250, 110, 2, 0.14);
        border-color: rgba(250, 110, 2, 0.45);
        outline: none;
      }

      .lang-toggle svg {
        width: 13px;
        height: 13px;
        opacity: 0.75;
        flex-shrink: 0;
      }

      /* ================================================
         MAIN CONTAINER
         ================================================ */
      .papi-container {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 400px;
        animation: float-in 0.55s ease-out both;
      }

      /* ================================================
         PROFILE AREA — video-ready
         ================================================ */
      .profile-wrapper {
        position: relative;
        width: 166px;
        height: 166px;
        margin-bottom: 1.75rem;
      }

      /* Ambient radial glow behind the ring */
      .profile-glow {
        position: absolute;
        inset: -22px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(250, 110, 2, 0.38) 0%,
          rgba(250, 110, 2, 0.12) 50%,
          transparent 75%
        );
        animation: glow-pulse 4s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
      }

      /* Rotating conic-gradient border ring */
      .profile-ring {
        position: relative;
        width: 166px;
        height: 166px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          #fa6e02    0%,
          #ec4700   25%,
          #dd8448   45%,
          rgba(250, 110, 2, 0.12) 65%,
          rgba(250, 110, 2, 0.55) 80%,
          #fa6e02  100%
        );
        animation: ring-rotate 3.5s linear infinite;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3px;
        z-index: 1;
      }

      /* Dark inner circle — masks the gradient center */
      .profile-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        background: #111111;
        flex-shrink: 0;
      }

      /* Profile image or video (ready to drop in) */
      .profile-media {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 50%;
      }

      /* ================================================
         IDENTITY
         ================================================ */
      .papi-name {
        font-family: "Poppins", system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(2rem, 9vw, 2.8rem);
        line-height: 1.1;
        background: var(--header-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-align: center;
        margin-bottom: 0.45rem;
        letter-spacing: -0.02em;
        width: fit-content;
        max-width: 100%;
      }

      .papi-role {
        font-family: "Antonio", system-ui, sans-serif;
        font-weight: 400;
        font-size: 1.1rem;
        color: var(--color-light-alt);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 0;
      }

      /* ================================================
         DIVIDER
         ================================================ */
      .papi-divider {
        width: 100%;
        max-width: 220px;
        height: 1px;
        background: linear-gradient(
          to right,
          transparent 0%,
          rgba(250, 110, 2, 0.55) 30%,
          rgba(250, 110, 2, 0.85) 50%,
          rgba(250, 110, 2, 0.55) 70%,
          transparent 100%
        );
        margin: 1.75rem auto;
      }

      /* ================================================
         ACTION BUTTONS
         ================================================ */
      .papi-actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: 100%;
      }

      .papi-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        height: 54px;
        padding: 0 1.5rem;
        border-radius: 27px;
        font-family: "Poppins", system-ui, sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        letter-spacing: 0.01em;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.25s ease;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        width: 100%;
      }

      .papi-btn:active {
        transform: scale(0.97) !important;
      }

      .papi-btn svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }

      /* --- WhatsApp — green (universally recognized) --- */
      .papi-btn--whatsapp {
        background: linear-gradient(135deg, #25d366 0%, #1a9e4d 100%);
        color: #ffffff;
        box-shadow: 0 4px 20px rgba(37, 211, 102, 0.2);
      }

      .papi-btn--whatsapp:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(37, 211, 102, 0.42);
        color: #ffffff;
      }

      /* --- Email — brand orange gradient --- */
      .papi-btn--email {
        background: var(--header-gradient);
        color: #ffffff;
        box-shadow: 0 4px 20px rgba(250, 110, 2, 0.22);
      }

      .papi-btn--email:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(250, 110, 2, 0.48);
        color: #ffffff;
      }

      /* --- Website — glass dark with orange border --- */
      .papi-btn--site {
        background: rgba(255, 255, 255, 0.04);
        color: #f5f5f5;
        border: 1px solid rgba(250, 110, 2, 0.45);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow:
          0 4px 16px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .papi-btn--site:hover {
        transform: translateY(-2px);
        background: rgba(250, 110, 2, 0.1);
        border-color: rgba(250, 110, 2, 0.75);
        box-shadow: 0 8px 28px rgba(250, 110, 2, 0.22);
        color: #f5f5f5;
      }

      /* --- Save contact — glass with amber border --- */
      .papi-btn--save {
        background: rgba(255, 255, 255, 0.03);
        color: #f5f5f5;
        border: 1px solid rgba(221, 132, 72, 0.38);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow:
          0 4px 16px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .papi-btn--save:hover {
        transform: translateY(-2px);
        background: rgba(221, 132, 72, 0.09);
        border-color: rgba(221, 132, 72, 0.68);
        box-shadow: 0 8px 28px rgba(221, 132, 72, 0.22);
        color: #f5f5f5;
      }

      /* ================================================
         BRANDING MARK
         ================================================ */
      .papi-brand {
        margin-top: 2.25rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        opacity: 0.28;
        transition: opacity 0.3s ease;
        text-decoration: none;
      }

      .papi-brand:hover {
        opacity: 0.6;
      }

      .papi-brand img {
        height: 24px;
        width: auto;
        /* Convert any color to white for dark background */
        filter: brightness(0) invert(1);
      }

      /* ================================================
         DESKTOP REFINEMENTS
         ================================================ */
      @media (min-width: 480px) {
        .papi-name {
          font-size: 3rem;
        }

        .profile-wrapper {
          width: 184px;
          height: 184px;
        }

        .profile-ring {
          width: 184px;
          height: 184px;
        }

        .profile-placeholder {
          font-size: 3.6rem;
        }
      }

      /* ================================================
         REDUCED MOTION
         ================================================ */
      @media (prefers-reduced-motion: reduce) {
        .bg-blob,
        .profile-glow,
        .profile-ring {
          animation: none;
        }

        .papi-container {
          animation: none;
        }

        .papi-btn {
          transition: none;
        }

        /* Static fallback ring */
        .profile-ring {
          background: var(--color-primary);
        }

        /* Static blob opacities */
        .bg-blob--1 { opacity: 0.35; }
        .bg-blob--2 { opacity: 0.25; }
        .bg-blob--3 { opacity: 0.2; }
      }
    </style>
  </head>

  <body>

    <main class="papi-container" role="main" id="main-content">

      <!-- ─── Identity ─────────────────────────────────────── -->
      <h1 class="papi-name">Alan Quintana</h1>

      <!-- ─── Divider ──────────────────────────────────────── -->

    <script>
      'use strict';

      /* ============================================================
         TRANSLATIONS
         ============================================================ */
      const i18n = {
        en: {
          role:           'Creative Developer',
          whatsapp:       'Send WhatsApp',
          email:          'Send Email',
          site:           'Visit Site',
          save:           'Save Contact',
          whatsappAria:   'Send WhatsApp message to Alan Quintana',
          emailAria:      'Send email to Alan Quintana',
          siteAria:       'Visit beaniwa.com website',
          saveAria:       'Save Alan Quintana contact card to your device',
          langLabel:      'ES',
          langToggleAria: 'Cambiar a Español',
        },
        es: {
          role:           'Creative Developer',
          whatsapp:       'Enviar WhatsApp',
          email:          'Enviar correo',
          site:           'Ver sitio',
          save:           'Guardar contacto',
          whatsappAria:   'Enviar mensaje de WhatsApp a Alan Quintana',
          emailAria:      'Enviar correo a Alan Quintana',
          siteAria:       'Visitar el sitio beaniwa.com',
          saveAria:       'Guardar tarjeta de contacto de Alan Quintana en tu dispositivo',
          langLabel:      'EN',
          langToggleAria: 'Switch to English',
        },
      };

      /* ============================================================
         LANGUAGE DETECTION
         Read from:
           1. sessionStorage (user already switched during this visit)
           2. navigator.language (browser preference)
           3. fallback → 'en'
         ============================================================ */
      function detectLang() {
        const stored = sessionStorage.getItem('papi-lang');
        if (stored === 'en' || stored === 'es') return stored;
        const nav = ((navigator.language || navigator.userLanguage || 'en')
          .split('-')[0]
          .toLowerCase());
        return nav === 'es' ? 'es' : 'en';
      }

      let currentLang = detectLang();

      function applyTranslations(lang) {
        const t = i18n[lang] || i18n['en'];

        // Update <html lang="...">
        document.documentElement.lang = lang;

        // Translate text nodes
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          const key = el.dataset.i18n;
          if (t[key] !== undefined) el.textContent = t[key];
        });

        // Translate aria-label attributes
        document.querySelectorAll('[data-i18n-aria]').forEach(function (el) {
          const key = el.dataset.i18nAria;
          if (t[key] !== undefined) el.setAttribute('aria-label', t[key]);
        });

        // Lang toggle: label shows the OTHER language
        const toggleLabel = document.getElementById('lang-toggle-label');
        const toggleBtn   = document.getElementById('lang-toggle');
        if (toggleLabel) toggleLabel.textContent = t.langLabel;
        if (toggleBtn)   toggleBtn.setAttribute('aria-label', t.langToggleAria);

        currentLang = lang;
        sessionStorage.setItem('papi-lang', lang);
      }

      // Wire up the toggle button
      var langToggleBtn = document.getElementById('lang-toggle');
      if (langToggleBtn) {
        langToggleBtn.addEventListener('click', function () {
          var next = currentLang === 'en' ? 'es' : 'en';
          applyTranslations(next);
        });
      }

      // Apply on page load
      applyTranslations(currentLang);

      /* ============================================================
         SAVE CONTACT — generates and downloads a vCard (.vcf)
         ============================================================ */
      function saveContact() {
        var vcard = [
          'BEGIN:VCARD',
          'VERSION:3.0',
          'N:Quintana;Alan;;;',
          'FN:Alan Quintana',
          'TITLE:Creative Developer',
          'ORG:Beaniwa',
          'TEL;TYPE=CELL:+526146849441',
          'EMAIL:alan@beaniwa.com',
          'URL:https://beaniwa.com',
          'END:VCARD',
        ].join('\r\n');

        try {
          var blob   = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
          var url    = URL.createObjectURL(blob);
          var anchor = document.createElement('a');
          anchor.href     = url;
          anchor.download = 'Alan-Quintana.vcf';
          document.body.appendChild(anchor);
          anchor.click();
          document.body.removeChild(anchor);
          URL.revokeObjectURL(url);
        } catch (err) {
          // Fallback for browsers that don't support Blob URLs
          window.open(
            'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcard),
            '_blank'
          );
        }
      }

      /* Attach save-contact handler to button */
      var saveBtn = document.getElementById('btn-save');
      if (saveBtn) {
        saveBtn.addEventListener('click', saveContact);
      }

      /* ============================================================
         PROFILE VIDEO CONTROL
         Start 1 second after load, play once, freeze on last frame
         ============================================================ */
      function initProfileVideo() {
        var video = document.getElementById('profile-video');
        if (!video) return;

        // Wait 1 second after page load
        setTimeout(function() {
          video.play().then(function() {
            // Listen for when video ends
            video.addEventListener('ended', function() {
              // Freeze on last frame by pausing
              video.pause();
            });
          }).catch(function(err) {
            console.warn('Profile video playback failed:', err);
          });
        }, 1000);
      }

      // Initialize video after DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initProfileVideo);
      } else {
        initProfileVideo();
      }
    </script>

  </body>
</html>
